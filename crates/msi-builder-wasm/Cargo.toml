[package]
name = "msi-builder-wasm"
version = "0.1.0"
edition = "2021"
description = "WebAssembly Windows Installer (MSI) compiler engine where all processing occurs local to the browser"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
msi = "0.10"
cab = "0.6"
cfb = "0.14"
uuid = { version = "1.10", features = ["v4", "v5", "js"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
sha2 = "0.10"
hex = "0.4"
thiserror = "1.0"
getrandom = { version = "0.2", features = ["js"] }
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "console",
    "FileSystemSyncAccessHandle",
    "FileSystemReadWriteOptions",
] }
velocity-msi = "0.1.0"
console_error_panic_hook = "0.1.7"
time = { version = "0.3", features = ["wasm-bindgen"] }

[dev-dependencies]
tempfile = "3.10"
